name: AttendEase CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'my-first-project-504508' }}
  REGION: ${{ secrets.GCP_REGION || 'asia-south1' }}
  REPO_NAME: attendease-repo

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Lint all services
  # -------------------------------------------------------------
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Frontend Checks
      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Test Frontend
        run: |
          cd frontend
          npm install
          npm run lint
          npm run build

      # 2. Backend Checks
      - name: Set up Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Syntax Check Backend
        run: |
          cd backend
          npm install
          node --check server.js
          node --check routes/courses.js
          node --check routes/attendance.js
          node --check routes/auth.js

      # 3. ML Service Checks
      - name: Set up Python for ML Service
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & Test ML Service
        run: |
          cd ml-service
          pip install -r requirements.txt
          python -c "from model import get_or_train_model, predict_risk; print(predict_risk(15, 20, 1))"

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Images
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build Docker Images
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ secrets.GCP_SA_KEY != '' }}
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }},${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ secrets.GCP_SA_KEY != '' }}
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }},${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:latest

      - name: Build ML Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: ${{ secrets.GCP_SA_KEY != '' }}
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ml-service:${{ github.sha }},${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ml-service:latest

  # -------------------------------------------------------------
  # Job 3: Deploy to Google Cloud Run
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.GCP_SA_KEY != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy ML Service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: attendease-ml-service
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/ml-service:latest
          region: ${{ env.REGION }}

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: attendease-backend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:latest
          region: ${{ env.REGION }}

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: attendease-frontend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:latest
          region: ${{ env.REGION }}
