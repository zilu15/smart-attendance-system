services:
  postgres:
    image: postgres:17
    container_name: smart-attendance-db
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "5432:5432"
    volumes:
      - attendance-db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-attendance-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smart-attendance-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - smart-attendance-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-attendance-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - smart-attendance-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-attendance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-attendance-net

volumes:
  attendance-db-data:

networks:
  smart-attendance-net:
    driver: bridge
