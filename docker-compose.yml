
services:
  postgres:
    image: postgres:17
    container_name: smart-attendance-db
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - attendance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  attendance-db-data:
